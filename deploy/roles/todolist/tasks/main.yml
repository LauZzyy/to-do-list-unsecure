---
# Rôle todolist : J1 ex. 5, 8, 9, 11, 12, 13, 17 + J2 (version déployée, secrets, règle prod)

# ---- J2 ex. 3 : la prod ne reçoit que du code validé (branche main) --------
- name: Refuser tout déploiement en production qui ne vient pas de main
  ansible.builtin.assert:
    that: app_branch == 'main'
    fail_msg: >-
      REFUS : la production ne reçoit que la branche main
      (branche demandée : {{ app_branch }}). Testez d'abord en recette (dev).
    quiet: true
  when: "'prod' in group_names"
  tags: [app]

# ---- Ex. 17 : utilisateur dédié sans droits d'administration ---------------
- name: Créer l'utilisateur système de l'application
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_dir }}"
    create_home: false
    password_lock: true
  tags: [app]

- name: Installer les paquets système
  ansible.builtin.apt:
    name: [git, python3, python3-venv, python3-pip, acl]
    state: present
  tags: [app]

# Héritage J1 ex. 8 : Gunicorn lancé en arrière-plan en root, à arrêter une fois
- name: Arrêter l'ancien Gunicorn lancé à la main (J1 ex. 8)
  ansible.builtin.shell: |
    kill "$(cat /run/todolist.pid)" 2>/dev/null || true
    rm -f /run/todolist.pid
  args:
    removes: /run/todolist.pid
  tags: [app]

- name: Créer le répertoire de l'application (propriétaire todolist)
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0750"
    recurse: true
  tags: [app]

# ---- Ex. 9 : sources depuis GitHub, à la version demandée ------------------
- name: Récupérer les sources ({{ app_version }})
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
    force: true
  become_user: "{{ app_user }}"
  register: app_git
  notify: Redémarrer todolist
  tags: [app]

- name: Générer requirements.txt depuis le Pipfile (source unique des versions)
  ansible.builtin.shell: python3 ci/pipfile_to_requirements.py Pipfile > .requirements.txt
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  changed_when: false
  tags: [app]

- name: Installer les dépendances Python dans le venv
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/.requirements.txt"
    virtualenv: "{{ venv_dir }}"
    virtualenv_command: python3 -m venv
  become_user: "{{ app_user }}"
  notify: Redémarrer todolist
  tags: [app]

- name: Installer Gunicorn dans le venv
  ansible.builtin.pip:
    name: gunicorn
    virtualenv: "{{ venv_dir }}"
    virtualenv_command: python3 -m venv
  become_user: "{{ app_user }}"
  tags: [app]

# ---- Ex. 12 : mode production ---------------------------------------------
# Code d'origine : DEBUG = True en dur -> on le passe à False sur la prod.
# Code corrigé (J2 ex. 14) : DEBUG vient de DJANGO_DEBUG, la ligne n'existe plus
# et backrefs évite d'ajouter quoi que ce soit.
- name: Désactiver DEBUG en dur sur la production (code d'origine)
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/todo/settings.py"
    regexp: '^DEBUG = True$'
    line: 'DEBUG = False'
    backrefs: true
  become_user: "{{ app_user }}"
  when: not django_debug
  notify: Redémarrer todolist
  tags: [app]

- name: Répertoire de configuration
  ansible.builtin.file:
    path: /etc/todolist
    state: directory
    owner: root
    group: "{{ app_user }}"
    mode: "0750"
  tags: [app]

- name: Variables d'environnement non sensibles
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/todolist/app.env
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Redémarrer todolist
  tags: [app]

# ---- J2 ex. 10 / 14 : secrets injectés par Jenkins, jamais dans le dépôt ----
- name: Secrets de l'application (fournis par le Credentials Store de Jenkins)
  ansible.builtin.template:
    src: secrets.env.j2
    dest: /etc/todolist/secrets.env
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  no_log: true
  when: django_secret_key | length > 0
  notify: Redémarrer todolist
  tags: [app]

- name: Appliquer les migrations Django (avec la même configuration que le service)
  ansible.builtin.shell: |
    set -a
    . /etc/todolist/app.env
    if [ -r /etc/todolist/secrets.env ]; then . /etc/todolist/secrets.env; fi
    set +a
    {{ venv_dir }}/bin/python manage.py migrate --noinput
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  register: migrate
  changed_when: "'No migrations to apply' not in migrate.stdout"
  tags: [app]

# ---- Ex. 13 + 17 : service systemd, utilisateur dédié ----------------------
- name: Installer le service systemd todolist
  ansible.builtin.template:
    src: todolist.service.j2
    dest: /etc/systemd/system/todolist.service
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer todolist
  tags: [app]

- name: Activer et démarrer le service au boot
  ansible.builtin.systemd_service:
    name: todolist
    enabled: true
    state: started
    daemon_reload: true
  tags: [app]

# ---- J2 ex. 8 : traçabilité côté serveur -----------------------------------
- name: Écrire la version déployée sur le serveur
  ansible.builtin.copy:
    dest: /etc/todolist/DEPLOYED_VERSION
    content: |
      branch={{ app_branch }}
      commit={{ app_git.after }}
      deployed_by={{ deployed_by }}
      build={{ deploy_build_url }}
      date={{ now(utc=true).isoformat() }}
    owner: root
    group: "{{ app_user }}"
    mode: "0644"
  tags: [app]

- name: Appliquer les redémarrages en attente avant le contrôle
  ansible.builtin.meta: flush_handlers
  tags: [app]

# ---- Ex. 11 : contrôle automatique -----------------------------------------
- name: Vérifier que l'application répond
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}/"
    status_code: 200
  delegate_to: localhost
  become: false
  register: check
  retries: 10
  delay: 3
  until: check.status == 200
  tags: [app]

- name: Résumé du déploiement
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} : {{ app_branch }} @ {{ app_git.after[:7] }} OK (DEBUG={{ django_debug }})"
  tags: [app]
